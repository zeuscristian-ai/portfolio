<style>
:root {
  color-scheme: dark;
  --bg: #100f09;
  --surface: #191710;
  --surface-2: #211f17;
  --line: #2e2b21;
  --text: #e7e6e4;
  --muted: #9e9c94;
  --faint: #6c6a61;
  --accent: #b9a55a;
  --accent-soft: rgba(185, 165, 90, .18);
  --c0: #24221b;
  --c1: #3f3c32;
  --c2: #6a675b;
  --c3: #a6a397;
  --c4: #f2f0e8;
  --display: "Audiowide", "Impact", system-ui, sans-serif;
  --body: "Lexend", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f3ef;
  --surface: #ebe9e2;
  --surface-2: #e2dfd6;
  --line: #d3cfc3;
  --text: #1b1a14;
  --muted: #5d5b53;
  --faint: #8a877c;
  --accent: #7d6b1f;
  --accent-soft: rgba(125, 107, 31, .14);
  --c0: #e1ded5;
  --c1: #c4c0b3;
  --c2: #938f82;
  --c3: #5c594f;
  --c4: #1b1a14;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 15px/1.6 var(--body);
  -webkit-font-smoothing: antialiased;
  padding-inline: 16px;
  transition: background-color .3s, color .3s;
}
a { color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
[hidden] { display: none !important; }

.wrap { max-width: 1040px; margin-inline: auto; padding-block: 56px 72px; display: grid; gap: 64px; }

/* Theme toggle */
.theme-toggle {
  position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; z-index: 10;
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer;
}
.theme-toggle:hover { color: var(--text); border-color: var(--line); background: var(--surface); }
.theme-toggle svg { width: 18px; height: 18px; }

/* Hero */
.hero { display: grid; justify-items: center; text-align: center; gap: 18px; }
.avatar {
  width: 148px; height: 148px; border-radius: 50%; overflow: hidden;
  background: var(--surface-2); border: 3px solid var(--line);
  box-shadow: 0 0 0 8px var(--accent-soft);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.name {
  margin: 8px 0 0; font: 400 clamp(2.4rem, 8vw, 4.6rem)/1.02 var(--display);
  letter-spacing: .01em; text-wrap: balance;
}
.handle { font: 400 .85rem var(--mono); color: var(--faint); margin-top: -8px; }
.role { margin: 0; font-weight: 500; font-size: 1.15rem; letter-spacing: .02em; color: var(--muted); }
.role strong { color: var(--text); font-weight: 600; }
.bio strong { font-weight: 500; color: var(--text); }
.bio { margin: 0; max-width: 36rem; font-style: italic; font-weight: 300; color: var(--muted); text-wrap: balance; }
.links { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px; margin-top: 6px; }
.links a {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  font-size: .95rem; color: var(--text); padding: 6px 2px; border-bottom: 1px solid transparent;
}
.links a:hover { border-bottom-color: var(--accent); }
.links svg { width: 17px; height: 17px; flex: none; }

/* Stats row */
.stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 28px; font-size: .88rem; color: var(--muted); }
.stats b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Contributions */
.contrib { display: grid; gap: 14px; justify-items: center; }
.contrib-head { margin: 0; font-weight: 300; color: var(--muted); font-size: 1rem; }
.contrib-head b { font: 400 1.9rem var(--display); color: var(--text); margin-right: 6px; font-variant-numeric: tabular-nums; }
.graph-scroll { width: 100%; overflow-x: auto; padding-bottom: 4px; }
.graph { width: max-content; margin-inline: auto; display: grid; gap: 6px; }
.months { position: relative; height: 18px; font-size: .78rem; color: var(--muted); }
.months span { position: absolute; top: 0; }
.cells { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); grid-auto-columns: 11px; gap: 3px; }
.cell { border-radius: 2px; background: var(--c0); }
.cell[data-l="1"] { background: var(--c1); }
.cell[data-l="2"] { background: var(--c2); }
.cell[data-l="3"] { background: var(--c3); }
.cell[data-l="4"] { background: var(--c4); }
.cell.pad { background: transparent; }
.graph-foot { display: flex; justify-content: space-between; gap: 16px; font-size: .78rem; color: var(--muted); }
.legend { display: inline-flex; align-items: center; gap: 3px; }
.legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
.legend span { margin-inline: 4px; }
.contrib-note { margin: 0; font-size: .75rem; color: var(--faint); max-width: 28rem; text-align: center; }

/* Tabs & filters */
.work { display: grid; gap: 28px; }
.tabs { display: flex; gap: 32px; flex-wrap: wrap; }
.tab {
  background: none; border: 0; padding: 0 0 6px; cursor: pointer;
  font: 600 1.35rem var(--body); letter-spacing: .08em; text-transform: uppercase;
  color: var(--faint); border-bottom: 2px solid transparent;
}
.tab:hover { color: var(--muted); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
.tab sup { font: 500 .7rem var(--mono); margin-left: 4px; letter-spacing: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 400 .85rem var(--body); color: var(--muted); background: transparent;
  border: 1px solid transparent; border-radius: 4px; padding: 5px 12px; cursor: pointer;
}
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"] { color: var(--text); background: var(--surface-2); border-color: var(--line); }

/* Timeline */
.year { display: grid; gap: 30px; }
.year-head { display: flex; align-items: center; gap: 14px; }
.year-head .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--faint); display: grid; place-items: center; flex: none; }
.year-head .dot::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--faint); }
.year-head h2 { margin: 0; font: 600 1.25rem var(--body); font-variant-numeric: tabular-nums; }
.year-head hr { flex: 1; border: 0; border-top: 1px solid var(--line); margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 44px 34px; align-items: start; padding-inline: 12px; }

/* Card */
.card { display: grid; gap: 12px; position: relative; }
.card:has(.stretch) { cursor: pointer; }
.stretch::after { content: ""; position: absolute; inset: 0; z-index: 1; }
.card .actions a { position: relative; z-index: 2; }
.card:has(.stretch:focus-visible) { outline: 2px solid var(--accent); outline-offset: 8px; }
.stretch:focus-visible { outline: none; }
.cover {
  position: relative; aspect-ratio: 1 / 1; max-width: 100%;
  background: var(--surface); overflow: hidden; display: grid; place-items: center;
  text-decoration: none;
}
.cover canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; transition: opacity .35s; }
.cover .initials { position: relative; font: 400 3.4rem var(--display); color: var(--faint); letter-spacing: .04em; transition: color .35s; }
.card:hover .cover canvas, .card:focus-within .cover canvas { opacity: .9; }
.card:hover .cover .initials { color: var(--text); }
.cover .live {
  position: absolute; top: 10px; left: 10px; font: 500 .7rem var(--mono); text-transform: uppercase; letter-spacing: .08em;
  background: var(--bg); color: var(--text); padding: 3px 8px; border-radius: 3px; display: inline-flex; align-items: center; gap: 6px;
}
.cover .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #5fbf6b; }
.cover .live.private::before { background: var(--accent); border-radius: 1px; }
.card h3 .h-private { border-bottom: 2px solid var(--line); padding-bottom: 2px; }
.tags { display: flex; flex-wrap: wrap; font-size: .8rem; font-weight: 600; }
.tags span + span::before { content: ""; display: inline-block; width: 1px; height: .9em; background: var(--line); margin: 0 8px; vertical-align: -1px; }
.card h3 { margin: 0; font: 600 1.2rem/1.3 var(--body); }
.card h3 a { text-decoration: none; border-bottom: 2px solid var(--accent); padding-bottom: 2px; }
.card h3 a:hover { color: var(--accent); }
.meta { font-size: .75rem; color: var(--faint); font-variant-numeric: tabular-nums; margin-top: -4px; }
.status { font-size: .85rem; color: var(--muted); font-weight: 300; }
.desc { margin: 0; font-size: .9rem; color: var(--text); opacity: .9; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.desc.empty { color: var(--faint); font-style: italic; opacity: 1; }
.stack { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .85rem; padding-left: 8px; }
.stack span { display: inline-flex; align-items: center; gap: 7px; }
.stack i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.stack small { color: var(--faint); font: 400 .72rem var(--mono); }
.actions { display: flex; flex-wrap: wrap; gap: 8px 18px; font: 500 .78rem var(--mono); }
.actions a { color: var(--muted); text-decoration: none; }
.actions a:hover { color: var(--text); }
.actions .stars { color: var(--faint); }

.empty-state { color: var(--faint); font-style: italic; padding: 24px 12px; }
.source { text-align: center; font-size: .75rem; color: var(--faint); display: grid; gap: 4px; }
.source a { color: var(--muted); }

@media (max-width: 560px) {
  .wrap { padding-block: 48px 56px; gap: 52px; }
  .avatar { width: 120px; height: 120px; }
  .grid { padding-inline: 0; gap: 40px; }
  .tabs { gap: 22px; }
  .tab { font-size: 1.1rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .reveal { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { transform: translateY(10px); } to { transform: none; } }
}
</style>

  async function getJSON(url, ms = 7000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try {
      const res = await fetch(url, { signal: ctrl.signal, headers: { Accept: "application/vnd.github+json" } });
      if (!res.ok) throw new Error(res.status + " " + url);
      return await res.json();
    } finally { clearTimeout(timer); }
  }

  async function fetchLive() {
    const api = "https://api.github.com";
    const [user, repos, contrib, allYears] = await Promise.all([
      getJSON(`${api}/users/${GITHUB_USER}`),
      getJSON(`${api}/users/${GITHUB_USER}/repos?per_page=100&sort=pushed`),
      getJSON(`https://github-contributions-api.jogruber.de/v4/${GITHUB_USER}?y=last`).catch(() => null),
      getJSON(`https://github-contributions-api.jogruber.de/v4/${GITHUB_USER}`).catch(() => null)
    ]);
    const languages = {};
    await Promise.all(repos.filter(r => !r.fork).map(r =>
      getJSON(`${api}/repos/${GITHUB_USER}/${r.name}/languages`).then(l => { languages[r.name] = l; }).catch(() => {})
    ));
    const data = { fetchedAt: new Date().toISOString(), live: true, user, repos, languages, avatarData: snapshot.avatarData };
    data.contributions = contrib ? {
      total: contrib.total.lastYear,
      start: contrib.contributions[0].date,
      counts: contrib.contributions.map(d => d.count),
      levels: contrib.contributions.map(d => d.level).join("")
    } : { ...snapshot.contributions };
    // Première année avec au moins une contribution (peut précéder la date de création du compte)
    const active = allYears ? Object.entries(allYears.total).filter(([, n]) => n > 0).map(([y]) => +y) : [];
    data.contributions.firstYear = active.length ? Math.min(...active) : snapshot.contributions.firstYear;
    return data;
  }

      if (c && Date.now() - c.t < CACHE_TTL) return c.data;

    try {
      const data = await fetchLive();
      try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data })); } catch (e) {}
      return data;
    } catch (e) {
      console.info("GitHub indisponible, affichage de l'instantané :", e.message);
      return { ...snapshot, live: false };
    }
  }

    c.counts.forEach((n, i) => {

      const col = Math.floor((i + lead) / 7);
      if (day.getDate() <= 7 && day.getMonth() !== lastMonth && col < Math.ceil((c.counts.length + lead) / 7) - 1) {
        lastMonth = day.getMonth();
        const m = fmtMonth.format(day).replace(".", "");
        months += `<span style="left:${col * 14}px">${m.charAt(0).toUpperCase() + m.slice(1)}</span>`;

      cells += `<i class="cell" data-l="${c.levels[i]}" title="${label}"></i>`;

  function drawCover(canvas, seedStr, color) {
    // Motif génératif déterministe : une empreinte de commits propre à chaque dépôt
    let h = 2166136261;
    for (const ch of seedStr) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    const rand = () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296;
    const size = 280, cols = 14, cell = size / cols;
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext("2d");
    for (let y = 0; y < cols; y++) for (let x = 0; x < cols; x++) {
      const v = rand();
      const band = Math.abs(x - y * 0.7 - cols * 0.25) < 3.2 ? 0.35 : 0;
      const a = v + band > 0.82 ? 0.5 : v + band > 0.62 ? 0.22 : 0.06;
      ctx.fillStyle = color; ctx.globalAlpha = a;
      ctx.fillRect(x * cell + 3, y * cell + 3, cell - 6, cell - 6);
    }
  }

    if (!groups[state.tab].length) state.tab = "projects";
    const tabLabels = { projects: "Projets", private: "Privés", forks: "Forks" };
    $("tabs").innerHTML = Object.keys(groups).filter(k => groups[k].length).map(k =>
      `<button class="tab" role="tab" id="tab-${k}" data-tab="${k}" aria-selected="${state.tab === k}">${tabLabels[k]}<sup>${groups[k].length}</sup></button>`).join("");

    const list = groups[state.tab];
    const tags = [...new Set(list.flatMap(r => r.tags))].sort((a, b) => a.localeCompare(b, "fr"));
    if (state.filter !== "all" && !tags.includes(state.filter)) state.filter = "all";
    $("filters").innerHTML = ["all", ...tags].map(t =>
      `<button class="chip" id="filter-${t}" data-filter="${t}" aria-pressed="${state.filter === t}">${t === "all" ? "Tous" : t[0].toUpperCase() + t.slice(1)}</button>`).join("");

    const shown = list.filter(r => state.filter === "all" || r.tags.includes(state.filter))
      .sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));
    const byYear = {};
    shown.forEach(r => (byYear[r.year] ||= []).push(r));
    const years = Object.keys(byYear).sort((a, b) => b - a);
    $("timeline").innerHTML = years.length ? years.map(y => `
      <div class="year">
        <div class="year-head"><span class="dot"></span><h2>${y}</h2><hr></div>
        <div class="grid">${byYear[y].map(card).join("")}</div>
      </div>`).join("") : '<p class="empty-state">Aucun dépôt dans cette catégorie.</p>';
    document.querySelectorAll(".cover canvas").forEach(c => drawCover(c, c.dataset.seed, c.dataset.color));
    try { localStorage.setItem("gh-portfolio-view", JSON.stringify(state)); } catch (e) {}
  }

  function renderSource(d) {
    const when = fmtDate.format(new Date(d.fetchedAt));
    $("source").innerHTML = `<span>Toutes les données viennent de <a href="${esc(d.user.html_url)}" target="_blank" rel="noopener">github.com/${esc(d.user.login)}</a>.</span>
      <span>${d.live ? "Chargées en direct depuis l'API GitHub" : "Instantané du " + when + " (API GitHub injoignable)"}</span>`;
  }

  function render(d) {
    renderHero(d);
    renderGraph(d.contributions);
    const repos = enrich(d);
    renderWork(repos);
    renderSource(d);
    $("tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (!b) return; state = { tab: b.dataset.tab, filter: "all" }; renderWork(repos); };
    $("filters").onclick = e => { const b = e.target.closest("[data-filter]"); if (!b) return; state.filter = b.dataset.filter; renderWork(repos); };
  }

  // Affiche l'instantané immédiatement, puis remplace par les données en direct
  render({ ...snapshot, live: false });
  loadData().then(d => { if (d.live) render(d); });
})();
</script>
</body>
</html>
